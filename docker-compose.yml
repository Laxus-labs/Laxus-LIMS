services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lims_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - lims_db_data:/var/lib/postgresql/data
      # Extensions (ltree, pgcrypto) are created by storage/0001_initial,
      # so a plain postgres image needs no bootstrap scripting.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lims_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lims_db_data:
